# PostgreSQL for local development. Matches the default DATABASE_URL in app/db.py.
# Set POSTGRES_PORT if 5432 is already taken by a local server.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: recruiter_bot
    ports:
      - "${POSTGRES_PORT:-5433}:5433"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d recruiter_bot"]
      interval: 2s
      timeout: 3s
      retries: 15
