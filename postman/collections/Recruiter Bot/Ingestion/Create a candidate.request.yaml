$kind: http-request
description: Creates a candidate and returns it with its new `id` (201). The name gets a timestamp so the request can be re-run.
url: "{{baseUrl}}/candidates"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "{{newCandidateName}}",
      "skills": [
        "Deduction",
        "forensics",
        "deduction"
      ],
      "experience_years": 30,
      "availability": "immediate",
      "traits": [
        "analytical",
        "autonomous"
      ],
      "quirk": "Little grey cells."
    }
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('newCandidateName', `Hercule P. ${Date.now()}`);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('status is 201', () => pm.response.to.have.status(201));
      const body = pm.response.json();
      pm.test('skills are lowercased and de-duplicated', () => pm.expect(body.skills).to.eql(['deduction', 'forensics']));
      pm.collectionVariables.set('newCandidateId', body.id);
    language: text/javascript
order: 1000
