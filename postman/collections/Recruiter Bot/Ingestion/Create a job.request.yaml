$kind: http-request
description: Creates a job and returns it with its new `id` (201). The title gets a timestamp so the request can be re-run.
url: "{{baseUrl}}/jobs"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "{{newJobTitle}}",
      "required_skills": [
        "chemistry"
      ],
      "min_experience": 5,
      "culture": [
        "reckless"
      ],
      "tagline": "Mind the fumes."
    }
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('newJobTitle', `Chief Chemist ${Date.now()}`);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('status is 201', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('newJobId', pm.response.json().id);
    language: text/javascript
order: 3000
