$kind: collection
description: |-
  Requests for the Recruiter Bot API, with test assertions on every request.

  **Before running:** start the API (`uvicorn app.main:app`) against a database seeded with `python -m app.seed`. Set `baseUrl` if the API is not on `http://localhost:8000`.

  Run the whole collection in order (Collection → Run) or from the command line:

  ```
  npx newman run postman/RecruiterBot.postman_collection.json
  ```

  The *Ingestion* requests create a candidate and a job with unique names on each run, so the collection can be re-run without reseeding. Reseed to remove them.
variables:
  baseUrl: http://localhost:8000
  jobId: "1"
  candidateId: "1"
  newCandidateName: ""
  newCandidateId: ""
  newJobTitle: ""
  newJobId: ""
