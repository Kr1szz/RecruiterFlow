$kind: http-request
description: "`limit` must be at least 1."
url: "{{baseUrl}}/jobs/{{jobId}}/matches?limit=0"
method: GET
queryParams:
  limit: "0"
scripts:
  - type: afterResponse
    code: pm.test('status is 422', () => pm.response.to.have.status(422));
    language: text/javascript
order: 5000
