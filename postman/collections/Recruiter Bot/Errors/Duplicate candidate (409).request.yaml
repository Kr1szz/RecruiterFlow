$kind: http-request
description: Re-uses the name from *Create a candidate*; names are unique. Run the Ingestion folder first.
url: "{{baseUrl}}/candidates"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "{{newCandidateName}}",
      "skills": [
        "deduction"
      ],
      "experience_years": 1,
      "availability": "immediate"
    }
scripts:
  - type: afterResponse
    code: pm.test('status is 409', () => pm.response.to.have.status(409));
    language: text/javascript
order: 3000
